name: Build PinPilot for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - '.github/workflows/publish-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinpilot-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Compile for the GitHub Pages repository URL
        run: pnpm build:static
        env:
          GITHUB_PAGES: '1'

      - name: Validate static site
        run: |
          test -s dist/public/index.html
          test -s dist/public/api/platform/config.js
          test -d dist/public/assets
          grep -q '/tle-pinterest-scheduler/assets/' dist/public/index.html
          echo "Validated PinPilot assets for /tle-pinterest-scheduler/"

      - name: Upload compiled site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: 'Publish PinPilot static site from ${{ github.sha }}'
