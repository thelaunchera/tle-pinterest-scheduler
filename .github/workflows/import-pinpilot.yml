name: Import PinPilot source ZIP

on:
  push:
    branches: [main]
    paths: ["pinpilot-source.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract verified PinPilot source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          archive = Path("pinpilot-source.zip")
          if not archive.exists():
              raise SystemExit("Missing source archive")
          expected = "3e5aa64da9404cc430f0f70c6af540d3ee60f6bd9e761aaa4af8eaddbc0df2a2"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("Source archive failed checksum verification")
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              if len(members) > 250 or sum(i.file_size for i in members) > 15_000_000:
                  raise SystemExit("Unexpected source archive size")
              for info in members:
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts or "\\" in info.filename:
                      raise SystemExit("Unsafe file path")
                  if not p.parts or p.parts[0] == ".git" or p.name == ".env":
                      raise SystemExit("Forbidden path")
                  if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit("Symlink not allowed")
              for info in members:
                  if info.is_dir():
                      continue
                  path = Path(info.filename)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(info))
          archive.unlink()
          PY
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import PinPilot source from Manus and configure GitHub Pages"
          git push origin HEAD:main
